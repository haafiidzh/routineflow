<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RoutineFlow — Claude Code Routines Demo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <nav class="topbar">
    <div class="topbar-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">RoutineFlow</span>
      <span class="brand-sub">Claude Code Routines Demo</span>
    </div>
    <div class="topbar-nav">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="routines">Routines</button>
      <button class="nav-btn" data-view="issues">Issues</button>
      <button class="nav-btn" data-view="deploys">Deploys</button>
      <button class="nav-btn" data-view="prs">Pull Requests</button>
      <button class="nav-btn" data-view="docs">Doc Health</button>
    </div>
    <div class="topbar-actions">
      <button class="btn-trigger" id="triggerDeploy">Trigger Deploy Check</button>
      <button class="btn-trigger" id="triggerAlert">Trigger Alert Triage</button>
      <button class="btn-trigger" id="triggerWebhook">Simulate PR Webhook</button>
    </div>
  </nav>

  <main id="app">
    <div id="view-dashboard" class="view active"></div>
    <div id="view-routines" class="view"></div>
    <div id="view-issues" class="view"></div>
    <div id="view-deploys" class="view"></div>
    <div id="view-prs" class="view"></div>
    <div id="view-docs" class="view"></div>
  </main>

  <div id="toast" class="toast hidden"></div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close">✕</button>
      <div id="modal-content"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
